openapi: 3.0.3
info:
  title: agent-sandbox-agent
  version: 1.0.0
  description: RESTful API exposed by the sandbox agent sidecar process.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: getHealthz
      responses:
        '200':
          description: Agent process is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      summary: Readiness probe
      operationId: getReadyz
      responses:
        '200':
          description: Agent process is ready to serve requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/ping:
    get:
      summary: Ping endpoint
      operationId: getPing
      responses:
        '200':
          description: Basic connectivity check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    PingResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: pong
