apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox-agent
  namespace: agent-sandbox-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-sandbox-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-sandbox-agent
    spec:
      containers:
      - name: agent
        image: sandbox/agent:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: AGENT_HTTP_ADDR
          value: :8080
        ports:
        - name: http
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
