apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-sandbox-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-sandbox-controller
    spec:
      serviceAccountName: agent-sandbox-controller
      containers:
      - name: controller
        image: sandbox/controller:latest
        imagePullPolicy: IfNotPresent
        args:
        - --configmap=agent-sandbox-runtime
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SANDBOX_GRPC_ADDR
          value: :9090
        - name: SANDBOX_HTTP_ADDR
          value: :8082
        ports:
        - name: metrics
          containerPort: 8080
        - name: healthz
          containerPort: 8081
        - name: http
          containerPort: 8082
        - name: grpc
          containerPort: 9090
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
